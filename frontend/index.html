<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Kuber Player — Your personal streaming library. Watch movies and series from your local media collection." />
  <meta name="theme-color" content="#0a0a0a" />
  <title>Kuber Player</title>
  <link rel="stylesheet" href="/src/ui/theme.css" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>▶</text></svg>" />
</head>
<body>

  <!-- ── Navigation ──────────────────────────────────────── -->
  <nav id="navbar">
    <div class="nav-logo" id="logo-btn">KUBER</div>
    <div class="nav-links">
      <a class="nav-link" id="nav-home" href="#home">Home</a>
      <a class="nav-link" id="nav-movies" href="#movies">Movies</a>
      <a class="nav-link" id="nav-series" href="#series">Series</a>
    </div>
    <div class="nav-right">
      <div class="nav-search" id="search-wrap">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" d="m21 21-5.197-5.197m0 0A7.5 7.5 0 1 0 5.196 5.196a7.5 7.5 0 0 0 10.607 10.607Z"/>
        </svg>
        <input id="search-input" type="search" placeholder="Search library..." autocomplete="off" />
      </div>
      <button id="log-toggle-btn" title="Toggle server log">
        <span class="dot"></span>
        Live Log
      </button>
    </div>
  </nav>

  <!-- ── Main App ─────────────────────────────────────────── -->
  <main id="app">
    <div class="loading-page">
      <div class="spinner"></div>
      <span style="font-size:13px;color:var(--text-2)">Loading library…</span>
    </div>
  </main>

  <!-- ── Log Panel ────────────────────────────────────────── -->
  <div id="log-panel">
    <div class="log-header">
      <span class="log-header-title">Server Log</span>
      <button class="log-close" id="log-close-btn">✕</button>
    </div>
    <div id="log-output"></div>
  </div>

  <script type="module" src="/src/main.ts"></script>
</body>
</html>
